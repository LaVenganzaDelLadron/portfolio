<section class="contact section-padding">
  <div class="container">
    <div class="contact-header">
      <app-section-title number="05" title="Get In Touch"></app-section-title>
      <p>I'm currently looking for new opportunities and my inbox is always open. Whether you have a question or just want to say hi, I'll try my best to get back to you!</p>
    </div>

    <div class="contact-grid">
      <div class="contact-form-wrapper">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="form-group">
            <input type="text" name="name" [(ngModel)]="formData.name" placeholder="Name" required>
          </div>
          <div class="form-group">
            <input type="email" name="email" [(ngModel)]="formData.email" placeholder="Email" required>
          </div>
          <div class="form-group">
            <input type="text" name="subject" [(ngModel)]="formData.subject" placeholder="Subject" required>
          </div>
          <div class="form-group">
            <textarea name="message" [(ngModel)]="formData.message" placeholder="Message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn-neon btn-full" [disabled]="!contactForm.form.valid">Send Message</button>
        </form>
      </div>

      <div class="contact-info">
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <div>
            <h4>Email</h4>
            <p>hello&#64;argus.dev</p>
          </div>
        </div>
        <div class="info-item">
          <i class="fas fa-map-marker-alt"></i>
          <div>
            <h4>Location</h4>
            <p>Global / Remote</p>
          </div>
        </div>
        <div class="social-grid">
          <a href="#" class="social-box"><i class="fab fa-github"></i></a>
          <a href="#" class="social-box"><i class="fab fa-linkedin"></i></a>
          <a href="#" class="social-box"><i class="fab fa-twitter"></i></a>
          <a href="#" class="social-box"><i class="fab fa-discord"></i></a>
        </div>
      </div>
    </div>
  </div>
</section>
