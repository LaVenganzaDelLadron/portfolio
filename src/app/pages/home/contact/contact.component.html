<section class="section-padding" id="contact">
  <div class="container">
    <div class="text-center max-w-[700px] mx-auto mb-20">
      <app-section-title number="06" title="Get In Touch"></app-section-title>
      <p class="text-text-secondary text-[1.15rem] leading-relaxed mt-4">I'm currently looking for new opportunities and my inbox is always open. Whether you have a question or just want to say hi, I'll try my best to get back to you!</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[1.4fr_1fr] gap-16 max-w-[1100px] mx-auto">
      <div class="bg-surface/40 p-10 rounded-[20px] border border-white/5 backdrop-blur-md sm:p-6">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="flex flex-col gap-8">
          <div class="relative">
            <input type="text" name="name" [(ngModel)]="formData.name" placeholder="Full Name" required
                   class="w-full px-5 py-4 bg-background/50 border border-white/10 rounded-xl text-text-primary font-sans text-base transition-all duration-300 placeholder:text-text-secondary/50 focus:outline-none focus:border-primary focus:bg-background/80 focus:shadow-[0_0_20px_rgba(0,255,153,0.1)]">
          </div>
          <div class="relative">
            <input type="email" name="email" [(ngModel)]="formData.email" placeholder="Email Address" required
                   class="w-full px-5 py-4 bg-background/50 border border-white/10 rounded-xl text-text-primary font-sans text-base transition-all duration-300 placeholder:text-text-secondary/50 focus:outline-none focus:border-primary focus:bg-background/80 focus:shadow-[0_0_20px_rgba(0,255,153,0.1)]">
          </div>
          <div class="relative">
            <input type="text" name="subject" [(ngModel)]="formData.subject" placeholder="Subject" required
                   class="w-full px-5 py-4 bg-background/50 border border-white/10 rounded-xl text-text-primary font-sans text-base transition-all duration-300 placeholder:text-text-secondary/50 focus:outline-none focus:border-primary focus:bg-background/80 focus:shadow-[0_0_20px_rgba(0,255,153,0.1)]">
          </div>
          <div class="relative">
            <textarea name="message" [(ngModel)]="formData.message" placeholder="Your Message" rows="5" required
                      class="w-full px-5 py-4 bg-background/50 border border-white/10 rounded-xl text-text-primary font-sans text-base transition-all duration-300 placeholder:text-text-secondary/50 focus:outline-none focus:border-primary focus:bg-background/80 focus:shadow-[0_0_20px_rgba(0,255,153,0.1)] resize-none"></textarea>
          </div>
          <button type="submit" [disabled]="!contactForm.form.valid"
                  class="w-full py-4 bg-primary text-background rounded-xl font-bold text-base uppercase tracking-widest border-none cursor-pointer transition-all duration-300 shadow-[0_4px_15px_rgba(0,255,153,0.2)] hover:not-disabled:-translate-y-1 hover:not-disabled:bg-[#21ffad] hover:not-disabled:shadow-[0_8px_25px_rgba(0,255,153,0.3)] disabled:opacity-40 disabled:cursor-not-allowed">
            Send Message
          </button>
        </form>
      </div>

      <div class="flex flex-col gap-10">
        <div class="flex items-center gap-6 group">
          <div class="w-14 h-14 bg-primary/5 border border-primary/20 rounded-xl flex items-center justify-center text-[1.4rem] text-primary transition-all duration-500 group-hover:bg-primary/10 group-hover:scale-110 group-hover:shadow-[0_0_15px_rgba(0,255,153,0.2)]">
            <i class="fas fa-envelope"></i>
          </div>
          <div>
            <h4 class="text-sm text-text-secondary uppercase tracking-widest mb-1.5">Email</h4>
            <p class="text-text-primary text-lg font-semibold">hello&#64;argus.dev</p>
          </div>
        </div>

        <div class="flex items-center gap-6 group">
          <div class="w-14 h-14 bg-primary/5 border border-primary/20 rounded-xl flex items-center justify-center text-[1.4rem] text-primary transition-all duration-500 group-hover:bg-primary/10 group-hover:scale-110 group-hover:shadow-[0_0_15px_rgba(0,255,153,0.2)]">
            <i class="fas fa-map-marker-alt"></i>
          </div>
          <div>
            <h4 class="text-sm text-text-secondary uppercase tracking-widest mb-1.5">Location</h4>
            <p class="text-text-primary text-lg font-semibold">Global / Remote</p>
          </div>
        </div>

        <div class="grid grid-cols-4 gap-5 mt-12">
          <a href="https://github.com" target="_blank" class="h-16 bg-surface/60 border border-white/5 rounded-xl flex items-center justify-center text-[1.6rem] text-text-secondary transition-all duration-500 hover:text-primary hover:border-primary/30 hover:bg-primary/5 hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(0,0,0,0.4)]" aria-label="GitHub"><i class="fab fa-github"></i></a>
          <a href="https://linkedin.com" target="_blank" class="h-16 bg-surface/60 border border-white/5 rounded-xl flex items-center justify-center text-[1.6rem] text-text-secondary transition-all duration-500 hover:text-primary hover:border-primary/30 hover:bg-primary/5 hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(0,0,0,0.4)]" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="https://twitter.com" target="_blank" class="h-16 bg-surface/60 border border-white/5 rounded-xl flex items-center justify-center text-[1.6rem] text-text-secondary transition-all duration-500 hover:text-primary hover:border-primary/30 hover:bg-primary/5 hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(0,0,0,0.4)]" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          <a href="https://discord.com" target="_blank" class="h-16 bg-surface/60 border border-white/5 rounded-xl flex items-center justify-center text-[1.6rem] text-text-secondary transition-all duration-500 hover:text-primary hover:border-primary/30 hover:bg-primary/5 hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(0,0,0,0.4)]" aria-label="Discord"><i class="fab fa-discord"></i></a>
        </div>
      </div>
    </div>
  </div>
</section>
