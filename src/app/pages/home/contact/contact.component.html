<section class="container" aria-label="Contact" id="contact">
  <app-section-title title="Contact" subtitle="Drop a message or follow the links below." />

  <div class="contact">
    <div class="panel">
      <h3>Social Links</h3>
      <div class="links">
        <a class="chip" href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
        <a class="chip" href="https://x.com/" target="_blank" rel="noopener">X</a>
        <a class="chip" href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>

    <div class="panel">
      <h3>Message</h3>
      <p class="muted">Starter form area. Wire up backend/email provider later.</p>
      <div class="form">
        <label>
          <span>Name</span>
          <input type="text" placeholder="Your name" />
        </label>
        <label>
          <span>Email</span>
          <input type="email" placeholder="you@example.com" />
        </label>
        <label class="full">
          <span>Message</span>
          <textarea rows="4" placeholder="Write your message..."></textarea>
        </label>
        <button type="button" class="send">Send</button>
      </div>
    </div>
  </div>
</section>
