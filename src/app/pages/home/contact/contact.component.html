<section class="section-padding" id="contact">
  <div class="container">
    <div class="mx-auto mb-12 max-w-2xl text-center">
      <app-section-title number="04" title="Let’s Work Together"></app-section-title>
      <p class="text-base leading-8 text-text-secondary md:text-lg">Have a security review, backend build, or Android project in mind? Send a short note.</p>
    </div>

    <div class="mx-auto grid max-w-5xl grid-cols-1 gap-6 lg:grid-cols-[1.2fr_0.8fr]">
      <div class="rounded-[20px] border border-white/5 bg-surface/40 p-6 shadow-[0_24px_70px_-52px_rgba(0,0,0,0.9)] backdrop-blur-md md:p-8">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="flex flex-col gap-4">
          <div class="relative">
            <input type="text" name="name" [(ngModel)]="formData.name" placeholder="Full Name" required
                   class="w-full rounded-[20px] border border-white/10 bg-background/50 px-5 py-4 font-sans text-base text-text-primary transition-all duration-300 placeholder:text-text-secondary/50 focus:border-primary focus:bg-background/80">
          </div>
          <div class="relative">
            <input type="email" name="email" [(ngModel)]="formData.email" placeholder="Email Address" required
                   class="w-full rounded-[20px] border border-white/10 bg-background/50 px-5 py-4 font-sans text-base text-text-primary transition-all duration-300 placeholder:text-text-secondary/50 focus:border-primary focus:bg-background/80">
          </div>
          <div class="relative">
            <input type="text" name="subject" [(ngModel)]="formData.subject" placeholder="Subject" required
                   class="w-full rounded-[20px] border border-white/10 bg-background/50 px-5 py-4 font-sans text-base text-text-primary transition-all duration-300 placeholder:text-text-secondary/50 focus:border-primary focus:bg-background/80">
          </div>
          <div class="relative">
            <textarea name="message" [(ngModel)]="formData.message" placeholder="Your Message" rows="5" required
                      class="w-full resize-none rounded-[20px] border border-white/10 bg-background/50 px-5 py-4 font-sans text-base text-text-primary transition-all duration-300 placeholder:text-text-secondary/50 focus:border-primary focus:bg-background/80"></textarea>
          </div>
          <button type="submit" [disabled]="!contactForm.form.valid"
                  class="w-full rounded-[20px] bg-primary py-4 text-base font-bold uppercase tracking-widest text-background transition-all duration-300 hover:not-disabled:-translate-y-0.5 hover:not-disabled:bg-[#21ffad] disabled:cursor-not-allowed disabled:opacity-40">
            Send Message
          </button>
        </form>
      </div>

      <div class="rounded-[20px] border border-white/5 bg-surface/30 p-6 backdrop-blur-md md:p-8">
        <div class="mb-8 flex items-center gap-5">
          <div class="flex h-12 w-12 items-center justify-center rounded-[20px] border border-primary/15 bg-primary/5 text-primary">
            <i class="fas fa-envelope"></i>
          </div>
          <div>
            <h4 class="mb-1 text-xs uppercase tracking-[1.5px] text-text-secondary">Email</h4>
            <p class="text-lg font-semibold text-text-primary">hello&#64;argus.dev</p>
          </div>
        </div>

        <div class="mb-10 flex items-center gap-5">
          <div class="flex h-12 w-12 items-center justify-center rounded-[20px] border border-primary/15 bg-primary/5 text-primary">
            <i class="fas fa-map-marker-alt"></i>
          </div>
          <div>
            <h4 class="mb-1 text-xs uppercase tracking-[1.5px] text-text-secondary">Location</h4>
            <p class="text-lg font-semibold text-text-primary">Global / Remote</p>
          </div>
        </div>

        <div class="grid grid-cols-4 gap-3">
          <a href="https://github.com/LaVenganzaDelLadron" target="_blank" class="flex h-14 items-center justify-center rounded-[20px] border border-white/5 bg-white/[0.03] text-xl text-text-secondary transition-all duration-300 hover:-translate-y-0.5 hover:border-primary/30 hover:text-primary" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.linkedin.com/in/elton-justaga-71373b342/" target="_blank" class="flex h-14 items-center justify-center rounded-[20px] border border-white/5 bg-white/[0.03] text-xl text-text-secondary transition-all duration-300 hover:-translate-y-0.5 hover:border-primary/30 hover:text-primary" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="tel:09972977654" target="_blank" class="flex h-14 items-center justify-center rounded-[20px] border border-white/5 bg-white/[0.03] text-xl text-text-secondary transition-all duration-300 hover:-translate-y-0.5 hover:border-primary/30 hover:text-primary" aria-label="Phone">
            <i class="fas fa-phone"></i>
          </a>
          <a href="https://discord.com" target="_blank" class="flex h-14 items-center justify-center rounded-[20px] border border-white/5 bg-white/[0.03] text-xl text-text-secondary transition-all duration-300 hover:-translate-y-0.5 hover:border-primary/30 hover:text-primary" aria-label="Discord">
            <i class="fab fa-discord"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
