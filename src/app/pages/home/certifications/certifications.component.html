<section class="section-padding">
  <div class="container">
    <app-section-title number="06" title="Certifications"></app-section-title>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
      <div class="bg-surface/40 border border-white/5 rounded-2xl p-6 flex gap-5 items-center transition-all duration-300 backdrop-blur-md hover:-translate-y-2 hover:bg-surface/70 hover:border-primary/30 hover:shadow-[0_15px_35px_-15px_rgba(0,0,0,0.5)] group"
           *ngFor="let cert of certificates">
        <div class="w-[50px] h-[50px] min-w-[50px] bg-white/5 rounded-xl flex items-center justify-center text-[1.25rem] text-textSecondary transition-all duration-300 group-hover:bg-primary/10 group-hover:text-primary group-hover:scale-110">
          <i class="fas fa-certificate"></i>
        </div>
        <div class="grow">
          <h3 class="text-[1.05rem] font-bold mb-1 text-textPrimary transition-colors group-hover:text-primary">{{ cert.name }}</h3>
          <p class="text-[0.8rem] text-textSecondary mb-3 opacity-80">{{ cert.issuer }} • {{ cert.date }}</p>
          <a [href]="cert.url" target="_blank" class="text-[0.75rem] text-primary font-bold uppercase tracking-wider inline-flex items-center gap-2 transition-all hover:tracking-widest hover:opacity-80">
            View Credential <i class="fas fa-external-link-alt text-[0.7rem]"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
