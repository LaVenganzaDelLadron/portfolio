<section class="certifications section-padding">
  <div class="container">
    <app-section-title number="06" title="Certifications"></app-section-title>

    <div class="certs-grid">
      <div class="cert-card" *ngFor="let cert of certificates">
        <div class="cert-icon">
          <i class="fas fa-certificate"></i>
        </div>
        <div class="cert-content">
          <h3 class="cert-name">{{ cert.name }}</h3>
          <p class="cert-issuer">{{ cert.issuer }} • {{ cert.date }}</p>
          <a [href]="cert.url" target="_blank" class="cert-link">View Credential <i class="fas fa-external-link-alt"></i></a>
        </div>
      </div>
    </div>
  </div>
</section>
