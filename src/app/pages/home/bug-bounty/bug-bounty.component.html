<section class="section-padding border-b border-white/5" id="bug-bounty">
  <div class="container">
    <app-section-title number="02" title="Bug Bounty Programs"></app-section-title>

    <div class="mb-10 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
      <p class="max-w-2xl text-base leading-8 text-text-secondary md:text-lg">
        Featured programs where I apply structured security research and vulnerability assessment.
      </p>
      <div class="flex gap-6 text-sm text-text-secondary">
        <span><strong class="text-text-primary">{{ programs.length }}</strong> programs</span>
        <span><strong class="text-text-primary">{{ getTotalVulns() }}</strong> findings</span>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-4">
      <article class="group flex min-h-full flex-col rounded-[20px] border border-white/5 bg-surface/40 p-5 shadow-[0_24px_70px_-52px_rgba(0,0,0,0.9)] backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-primary/25"
               *ngFor="let program of programs">
        <div class="mb-5 flex h-36 items-center justify-center rounded-[20px] border border-white/5 bg-background/45 p-4">
          <img [src]="program.image" [alt]="program.name"
               class="max-h-full max-w-full object-contain opacity-90 transition duration-300 group-hover:opacity-100">
        </div>

        <div class="mb-4 flex items-center justify-between gap-3">
          <h3 class="text-xl font-bold tracking-tight text-text-primary">{{ program.name }}</h3>
          <span *ngIf="program.featured" class="rounded-full border border-primary/20 bg-primary/5 px-3 py-1 text-[0.65rem] font-bold uppercase tracking-[1.3px] text-primary">
            Featured
          </span>
        </div>

        <p class="leading-7 text-text-secondary">{{ program.description }}</p>
      </article>
    </div>
  </div>
</section>
