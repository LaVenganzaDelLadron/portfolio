<section class="skills section-padding" id="skills">
  <div class="container">
    <app-section-title number="02" title="Technical Arsenal"></app-section-title>

    <div class="skills-grid" [@staggerFadeIn]="skillCategories.length">
      @for (category of skillCategories; track category.title) {
        <div class="skill-card">
          <div class="card-header">
            <div class="icon-wrapper">
              <i [class]="category.icon"></i>
            </div>
            <h3 class="category-title">{{ category.title }}</h3>
          </div>
          <div class="skills-list">
            @if (isStringArray(category.skills)) {
              @for (skill of category.skills; track skill) {
                <span class="skill-badge">{{ skill }}</span>
              }
            }
          </div>
          <div class="card-bg-effect"></div>
        </div>
      }
    </div>
  </div>
</section>
