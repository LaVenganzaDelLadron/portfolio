<section class="skills section-padding">
  <div class="container">
    <app-section-title number="02" title="Technical Arsenal"></app-section-title>

    <div class="skills-grid">
      <div class="skill-category" *ngFor="let cat of categories">
        <h3 class="category-title">{{ formatCategory(cat) }}</h3>
        <div class="skills-list">
          <div class="skill-item" *ngFor="let skill of getSkillsByCategory(cat)">
            <div class="skill-info">
              <span>{{ skill.name }}</span>
              <span>{{ skill.level }}%</span>
            </div>
            <div class="skill-bar-bg">
              <div class="skill-bar-fill" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
