<section class="section-padding" id="experience">
  <div class="container">
    <app-section-title number="04" title="Professional Path"></app-section-title>

    <div class="flex flex-col md:flex-row gap-8 lg:gap-16 max-w-[900px] mx-auto min-h-[400px]">
      <div class="relative flex overflow-x-auto md:flex-col md:overflow-x-visible md:border-l-2 md:border-white/5 md:min-w-[180px] border-b-2 border-white/5 md:border-b-0 scrollbar-hide">
        <button
          *ngFor="let exp of experiences; let i = index"
          (click)="setActiveTab(i)"
          class="px-6 py-4 text-left text-textSecondary font-mono text-[0.85rem] transition-all duration-300 whitespace-nowrap bg-transparent cursor-pointer tracking-wider md:w-full hover:bg-primary/5 hover:text-primary"
          [ngClass]="activeTab === i ? 'text-primary bg-primary/5' : ''">
          {{ exp.company }}
        </button>

        <!-- Vertical Indicator -->
        <div class="hidden md:block absolute left-[-2px] w-[2px] bg-primary transition-transform duration-300 ease-[cubic-bezier(0.645,0.045,0.355,1)] shadow-[0_0_10px_rgba(0,255,153,0.5)]"
             [style.height.px]="48"
             [style.transform]="'translateY(' + (activeTab * 48) + 'px)'"></div>

        <!-- Horizontal Indicator for Mobile -->
        <div class="md:hidden absolute bottom-[-2px] h-[2px] bg-primary transition-all duration-300"
             [style.width.px]="100"
             [style.transform]="'translateX(' + (activeTab * 100) + 'px)'"></div>
      </div>

      <div class="grow pt-2">
        <div class="animate-fadeIn" *ngIf="experiences[activeTab]">
          <h3 class="text-2xl font-bold mb-2 text-textPrimary">
            {{ experiences[activeTab].position }}
            <span class="text-primary font-semibold">@ {{ experiences[activeTab].company }}</span>
          </h3>
          <p class="text-[0.85rem] text-textSecondary mb-8 tracking-widest uppercase font-mono">{{ experiences[activeTab].period }}</p>

          <ul class="flex flex-col gap-5 mb-10">
            <li *ngFor="let desc of experiences[activeTab].description"
                class="relative pl-7 text-textSecondary text-[1.05rem] leading-relaxed before:content-['▹'] before:absolute before:left-0 before:text-primary before:text-xl before:leading-none">
              {{ desc }}
            </li>
          </ul>

          <div class="flex flex-wrap gap-3">
            <span *ngFor="let tech of experiences[activeTab].technologies"
                  class="px-4 py-1.5 bg-surface/60 border border-primary/10 rounded-md text-primary font-mono text-[0.75rem] transition-all duration-200 hover:bg-primary/10 hover:border-primary/30 hover:-translate-y-0.5">
              {{ tech }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
