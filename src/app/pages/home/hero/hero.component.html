<section class="hero" @fadeInUp>
  <div class="hero-bg-effects">
    <div class="glow-circle circle-1"></div>
    <div class="glow-circle circle-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container hero-content">
    <div class="hero-badge">
      <span class="pulse"></span>
      Available for new projects
    </div>

    <h1 class="hero-title">
      Securing the <span class="text-gradient">Digital</span><br>
      Frontier with Code.
    </h1>

    <p class="hero-subtitle">
      <span class="mono">> </span> {{ displayText }}<span class="cursor">|</span>
    </p>

    <p class="hero-description">
      Specializing in building robust, high-performance applications with a
      security-first mindset. From intrusion detection to scalable microservices.
    </p>

    <div class="hero-actions">
      <button class="btn-neon">View Projects</button>
      <button class="btn-ghost">Contact Me</button>
    </div>

    <div class="hero-socials">
      <a href="#"><i class="fab fa-github"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
    </div>
  </div>
</section>
