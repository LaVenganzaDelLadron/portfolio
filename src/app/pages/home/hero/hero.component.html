<section class="hero" @fadeInUp>
  <div class="hero-bg-effects">
    <div class="glow-circle circle-1"></div>
    <div class="glow-circle circle-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container hero-content">
    <div class="hero-text">
      <div class="hero-badge">
        <span class="pulse"></span>
        Available for new opportunities
      </div>

      <h1 class="hero-title">
        Securing the <span class="text-gradient">Digital</span><br>
        Frontier with Code.
      </h1>

      <p class="hero-subtitle">
        <span class="mono">> </span>{{ displayText }}<span class="cursor"></span>
      </p>

      <p class="hero-description">
        Expert in building secure, high-performance applications with an
        engineering-first mindset. From cybersecurity research to scalable full-stack development.
      </p>

      <div class="hero-actions">
        <button class="btn-neon">View Projects</button>
        <button class="btn-ghost">Contact Me</button>
      </div>

      <div class="hero-socials">
        <a href="https://github.com" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="https://twitter.com" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      </div>
    </div>

    <div class="hero-image-container">
      <div class="image-wrapper">
        <img src="assets/images/profile/profile.jpeg" alt="Argus Profile" class="profile-img">
      </div>
    </div>
  </div>
</section>
