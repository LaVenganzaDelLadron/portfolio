<section class="section-padding border-b border-white/5" id="profile">
  <div class="container">
    <app-section-title number="01" title="Profile"></app-section-title>

    <div class="grid grid-cols-1 gap-8 lg:grid-cols-[0.95fr_1.05fr] lg:items-start">
      <div>
        <p class="max-w-2xl text-base leading-8 text-text-secondary md:text-lg">
          I am a cybersecurity enthusiast and developer focused on building secure systems,
          analyzing vulnerabilities, and developing scalable applications.
        </p>

        <div class="mt-8 flex flex-wrap gap-3">
          <span *ngFor="let role of roles"
                class="rounded-[20px] border border-white/10 bg-white/[0.03] px-4 py-2 text-sm font-medium text-text-secondary transition-all duration-300 hover:border-primary/30 hover:text-primary">
            {{ role }}
          </span>
        </div>

        <div class="mt-10 rounded-[20px] border border-white/5 bg-surface/35 p-6 shadow-[0_24px_70px_-52px_rgba(0,0,0,0.9)] backdrop-blur-md">
          <h3 class="mb-5 text-lg font-bold tracking-tight text-text-primary">Key Highlights</h3>
          <ul class="space-y-4">
            <li *ngFor="let highlight of highlights" class="flex gap-3 text-text-secondary">
              <span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-primary"></span>
              <span>{{ highlight }}</span>
            </li>
          </ul>
        </div>
      </div>

      <article class="mx-auto w-full max-w-md rounded-[20px] border border-white/5 bg-surface/45 p-5 shadow-[0_24px_70px_-48px_rgba(0,0,0,0.9)] backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-primary/20">
        <img src="assets/images/profile/profile.jpeg" alt="Argus Profile"
             class="aspect-[4/5] w-full rounded-[20px] object-cover">

        <div class="p-3 pt-6">
          <h3 class="text-3xl font-extrabold tracking-tight text-text-primary">Argus</h3>
          <p class="mt-2 text-primary">Security Researcher &amp; Developer</p>
          <p class="mt-4 leading-7 text-text-secondary">
            Learn by building; breaking; rebuilding.
          </p>
        </div>
      </article>
    </div>
  </div>
</section>
