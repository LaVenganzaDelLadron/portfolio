<section class="section-padding border-b border-white/5" id="projects">
  <div class="container">
    <div class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
      <app-section-title number="02" title="Selected Projects"></app-section-title>
      <button class="mb-10 inline-flex w-full items-center justify-center rounded-[20px] border border-white/10 bg-white/[0.03] px-5 py-3 text-sm font-semibold text-text-primary transition-all duration-300 hover:-translate-y-0.5 hover:border-primary/40 hover:bg-primary/5 sm:w-auto">
        View All Projects
      </button>
    </div>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
      <article class="group flex min-h-full flex-col overflow-hidden rounded-[20px] border border-white/5 bg-surface/45 shadow-[0_24px_70px_-48px_rgba(0,0,0,0.9)] backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:scale-[1.01] hover:border-primary/30 hover:shadow-[0_24px_80px_-44px_rgba(0,255,153,0.28)]"
               *ngFor="let project of featuredProjects">
        <a [href]="project.liveUrl" target="_blank" rel="noopener" class="block overflow-hidden">
          <img [src]="project.image" [alt]="project.title"
               class="aspect-[16/10] w-full object-cover opacity-90 transition duration-500 group-hover:scale-[1.02] group-hover:opacity-100">
        </a>

        <div class="flex grow flex-col p-6 md:p-7">
          <div class="mb-4 flex items-start justify-between gap-4">
            <h3 class="text-2xl font-bold tracking-tight text-text-primary">{{ project.title }}</h3>
            <span class="rounded-full border border-white/10 bg-white/[0.03] px-3 py-1 text-[0.68rem] font-bold uppercase tracking-[1.4px] text-text-secondary">{{ project.category }}</span>
          </div>

          <p class="mb-6 line-clamp-2 leading-7 text-text-secondary">{{ project.description }}</p>

          <div class="mb-8 flex flex-wrap gap-2">
            <span *ngFor="let tech of project.technologies.slice(0, 5)"
                  class="rounded-full border border-white/10 bg-background/40 px-3 py-1.5 font-mono text-xs text-text-secondary">
              {{ tech }}
            </span>
          </div>

          <div class="mt-auto grid grid-cols-2 gap-3">
            <a [href]="project.githubUrl" target="_blank" rel="noopener"
               class="inline-flex items-center justify-center gap-2 rounded-[20px] border border-white/10 bg-white/[0.03] px-4 py-3 text-sm font-semibold text-text-primary transition duration-300 hover:border-primary/40 hover:bg-primary/5 hover:text-primary">
              <i class="fab fa-github"></i>
              GitHub
            </a>
            <a [href]="project.liveUrl" target="_blank" rel="noopener"
               class="inline-flex items-center justify-center gap-2 rounded-[20px] bg-primary px-4 py-3 text-sm font-bold text-background transition duration-300 hover:bg-[#21ffad]">
              <i class="fas fa-arrow-up-right-from-square text-xs"></i>
              Demo
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
