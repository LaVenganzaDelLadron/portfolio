<article class="group overflow-hidden rounded-[24px] border border-white/10 bg-surface transition-all duration-300 hover:-translate-y-1 hover:scale-[1.01] hover:border-primary/25 hover:shadow-[0_24px_80px_-50px_rgba(0,255,153,0.22)]" [attr.aria-label]="project().title">
  <div class="p-6">
    <div class="panel-header mb-4">
      <span>PROJECT LOG</span>
      <span class="text-secondary">{{ project().category }}</span>
    </div>

    <h3 class="text-2xl font-bold text-text-primary group-hover:text-primary transition-colors">{{ project().title }}</h3>
    <p class="text-text-secondary text-sm leading-relaxed mb-6 mt-4 line-clamp-3">{{ project().description }}</p>

    <div class="flex flex-wrap gap-2 mb-6">
      @for (tech of project().technologies; track tech) {
        <span class="rounded-full border border-white/10 bg-background/70 px-3 py-1 font-mono text-[0.7rem] uppercase tracking-[0.18em] text-primary/80">{{ tech }}</span>
      }
    </div>
  </div>

  <div class="relative overflow-hidden aspect-video">
    <img [src]="project().image" [alt]="project().title" loading="lazy"
         class="w-full h-full object-cover transition-all duration-700 group-hover:scale-110" />
    <div class="absolute inset-0 bg-gradient-to-t from-background/80 via-transparent to-transparent"></div>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-4 p-6 border-t border-white/10">
    <a class="text-sm font-bold text-primary uppercase tracking-[0.24em] transition-all hover:text-[#a6ffe1]"
       [href]="project().liveUrl" target="_blank" rel="noopener">
      Live demo
    </a>
    <a class="text-text-secondary text-lg transition-all hover:text-text-primary hover:scale-110"
       [href]="project().githubUrl" target="_blank" rel="noopener">
      <i class="fab fa-github"></i>
    </a>
  </div>
</article>
