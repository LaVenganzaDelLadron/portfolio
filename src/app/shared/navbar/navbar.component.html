<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="container navbar-container">
    <a routerLink="/" class="logo">
      <img src="assets/images/icon/white_logo.png" alt="ARGUS Logo" class="logo-img" />
    </a>

    <!-- Desktop Menu -->
    <ul class="nav-links">
      <li *ngFor="let link of navLinks">
        <a [routerLink]="link.path" [fragment]="link.fragment" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          {{ link.name }}
        </a>
      </li>
    </ul>

    <div class="nav-actions">
      <button class="btn-resume">Resume</button>
      <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Toggle mobile menu">
        <span class="bar" [class.open]="isMobileMenuOpen"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <ul class="mobile-nav-links">
      <li *ngFor="let link of navLinks">
        <a [routerLink]="link.path" [fragment]="link.fragment" (click)="closeMobileMenu()">
          {{ link.name }}
        </a>
      </li>
      <li>
        <button class="btn-resume btn-resume-mobile">Resume</button>
      </li>
    </ul>
  </div>
</nav>
