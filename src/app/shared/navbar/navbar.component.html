<nav class="fixed top-0 left-0 w-full z-[1000] transition-all duration-300"
     [ngClass]="isScrolled ? 'py-3 bg-background/80 backdrop-blur-md border-b border-white/5' : 'py-6'">
  <div class="container flex justify-between items-center">
    <a routerLink="/" class="z-[1001]">
      <img src="assets/images/icon/white_logo.png" alt="ARGUS Logo"
           class="h-[38px] w-auto drop-shadow-[0_0_8px_rgba(0,255,153,0.3)] transition-all duration-300 hover:drop-shadow-[0_0_12px_rgba(0,255,153,0.5)] hover:brightness-110 hover:scale-105" />
    </a>

    <!-- Desktop Menu -->
    <ul class="hidden md:flex gap-10 items-center">
      <li *ngFor="let link of navLinks">
        <a [routerLink]="link.path" [fragment]="link.fragment"
           routerLinkActive="text-primary"
           [routerLinkActiveOptions]="{exact: true}"
           #rla="routerLinkActive"
           class="text-text-secondary text-[0.85rem] font-medium uppercase tracking-[1.5px] relative py-2 transition-colors hover:text-primary group">
          {{ link.name }}
          <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-primary transition-all duration-300 shadow-[0_0_8px_#00ff99] group-hover:w-full"
                [ngClass]="{'w-full': rla.isActive}"></span>
        </a>
      </li>
    </ul>

    <div class="flex items-center gap-6 z-[1001]">
      <button class="hidden md:block px-6 py-2.5 bg-transparent text-primary border border-primary rounded-sm text-[0.85rem] font-semibold uppercase tracking-wider relative overflow-hidden transition-all duration-300 hover:bg-primary/5 hover:shadow-[0_0_15px_rgba(0,255,153,0.2)] hover:-translate-y-0.5 before:content-[''] before:absolute before:top-0 before:-left-full before:w-full before:h-full before:bg-gradient-to-r before:from-transparent before:via-primary/10 before:to-transparent before:transition-all before:duration-500 hover:before:left-full">
        Resume
      </button>

      <button class="block md:hidden w-[30px] h-[20px] relative bg-none border-none cursor-pointer"
              (click)="toggleMobileMenu()" aria-label="Toggle mobile menu">
        <span class="absolute w-full h-[2px] bg-text-primary transition-all duration-300 left-0"
              [ngClass]="isMobileMenuOpen ? 'bg-transparent' : 'bg-text-primary'">
          <span class="absolute w-full h-[2px] bg-text-primary left-0 transition-all duration-300"
                [ngClass]="isMobileMenuOpen ? 'rotate-45 top-0 bg-primary' : '-top-2'"></span>
          <span class="absolute w-full h-[2px] bg-text-primary left-0 transition-all duration-300"
                [ngClass]="isMobileMenuOpen ? '-rotate-45 bottom-0 bg-primary' : '-bottom-2'"></span>
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="fixed top-0 right-0 w-full h-screen bg-surface/95 backdrop-blur-2xl z-[1000] flex flex-col justify-center items-center transition-all duration-500"
       [ngClass]="isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full'">
    <ul class="flex flex-col gap-10 text-center">
      <li *ngFor="let link of navLinks">
        <a [routerLink]="link.path" [fragment]="link.fragment" (click)="closeMobileMenu()"
           class="text-[1.75rem] font-bold text-text-primary uppercase tracking-[2px] hover:text-primary transition-colors">
          {{ link.name }}
        </a>
      </li>
      <li>
        <button class="mt-8 px-12 py-4 text-xl font-bold text-primary border border-primary rounded-md uppercase tracking-widest hover:bg-primary/5 transition-all">
          Resume
        </button>
      </li>
    </ul>
  </div>
</nav>
