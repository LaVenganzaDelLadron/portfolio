<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="container navbar-container">
    <a routerLink="/" class="logo">
      <span class="logo-accent">&lt;</span>
      ARGUS
      <span class="logo-accent">/&gt;</span>
    </a>

    <!-- Desktop Menu -->
    <ul class="nav-links">
      <li *ngFor="let link of navLinks">
        <a [routerLink]="link.path" [fragment]="link.fragment" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          {{ link.name }}
        </a>
      </li>
    </ul>

    <div class="nav-actions">
      <button class="btn-primary btn-sm">Resume</button>
      <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
        <span class="bar" [class.open]="isMobileMenuOpen"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <ul class="mobile-nav-links">
      <li *ngFor="let link of navLinks">
        <a [routerLink]="link.path" [fragment]="link.fragment" (click)="closeMobileMenu()">
          {{ link.name }}
        </a>
      </li>
      <li>
        <button class="btn-primary btn-full">Resume</button>
      </li>
    </ul>
  </div>
</nav>
