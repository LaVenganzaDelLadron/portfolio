<nav class="fixed top-0 left-0 w-full z-[1000] transition-all duration-300"
     [ngClass]="isScrolled ? 'border-b border-white/10 bg-background/90 backdrop-blur-xl py-3 shadow-[0_20px_60px_-45px_rgba(0,0,0,0.85)]' : 'py-4'">
  <div class="container flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <a routerLink="/" class="flex items-center gap-3 z-[1001]">
        <img src="assets/images/icon/white_logo.png" alt="ARGUS Logo"
             class="h-[46px] w-auto drop-shadow-[0_0_10px_rgba(0,255,153,0.28)] transition-all duration-300 hover:drop-shadow-[0_0_16px_rgba(0,255,153,0.4)] hover:brightness-110" />
        <div class="hidden sm:flex flex-col text-sm leading-none">
          <span class="font-mono uppercase tracking-[0.35em] text-primary/80">DARK GLITCH</span>
          <span class="text-text-secondary">SECURITY MODULE</span>
        </div>
      </a>
      <span class="hidden md:inline-flex items-center gap-2 rounded-full border border-primary/20 bg-primary/5 px-3 py-1 text-[0.72rem] uppercase tracking-[0.35em] text-primary">
        <span class="h-2 w-2 rounded-full bg-primary animate-pulse"></span> online
      </span>
    </div>

    <!-- Desktop Menu -->
    <ul class="hidden md:flex gap-8 items-center">
      <li *ngFor="let link of navLinks">
        <a [routerLink]="link.path" [fragment]="link.fragment"
           routerLinkActive="text-primary"
           [routerLinkActiveOptions]="{exact: true}"
           #rla="routerLinkActive"
           class="text-text-secondary text-[0.82rem] font-semibold uppercase tracking-[0.2em] relative py-2 transition-colors hover:text-primary group">
          {{ link.name }}
          <span class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary transition-all duration-300 shadow-[0_0_8px_#00ff99] group-hover:w-full"
                [ngClass]="{'w-full': rla.isActive}"></span>
        </a>
      </li>
    </ul>

    <button class="md:hidden inline-flex h-12 w-12 items-center justify-center rounded-full border border-white/10 bg-surface/90 text-text-primary transition-all duration-300 hover:bg-surface hover:text-primary"
            (click)="toggleMobileMenu()" aria-label="Toggle mobile menu">
      <span class="relative block h-[2px] w-6 bg-current transition-transform duration-300"
            [ngClass]="isMobileMenuOpen ? 'rotate-45' : 'translate-y-0'">
      </span>
      <span class="absolute block h-[2px] w-6 bg-current transition-opacity duration-300"
            [ngClass]="isMobileMenuOpen ? 'opacity-0' : 'opacity-100'">
      </span>
      <span class="absolute block h-[2px] w-6 bg-current transition-transform duration-300"
            [ngClass]="isMobileMenuOpen ? '-rotate-45' : 'translate-y-2'">
      </span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="fixed inset-0 z-[1000] bg-background/95 backdrop-blur-3xl transition-transform duration-500"
       [ngClass]="isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full'">
    <div class="flex h-full flex-col justify-center items-center gap-10 px-8">
      <button class="absolute top-6 right-6 rounded-full border border-white/10 bg-surface/90 px-4 py-3 text-text-primary transition-all duration-300 hover:text-primary"
              (click)="toggleMobileMenu()" aria-label="Close mobile menu">
        CLOSE
      </button>

      <ul class="flex flex-col gap-8 text-center">
        <li *ngFor="let link of navLinks">
          <a [routerLink]="link.path" [fragment]="link.fragment" (click)="closeMobileMenu()"
             class="text-[1.5rem] font-bold text-text-primary uppercase tracking-[0.18em] transition-colors hover:text-primary">
            {{ link.name }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
