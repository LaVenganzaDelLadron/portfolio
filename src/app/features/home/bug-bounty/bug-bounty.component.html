<section class="section-padding border-b border-white/5 bg-[#0d1117]" id="bug-bounty">
  <div class="container mx-auto">
    <app-section-title number="02" title="Bug Bounty Programs"></app-section-title>

    <div class="mb-12 flex flex-col gap-6 md:flex-row md:items-end md:justify-between">

      <p class="max-w-2xl text-lg leading-relaxed text-text-secondary">
        Featured programs where I apply structured security research, penetration testing, and coordinated vulnerability disclosure.
      </p>
      <div class="flex gap-8 font-mono text-xs uppercase tracking-widest text-text-secondary bg-surface/30 px-6 py-3 rounded-full border border-white/5">
        <span><strong class="text-primary">{{ programs.length }}</strong> Programs</span>
        <span class="w-px h-4 bg-white/10"></span>
        <span><strong class="text-secondary">{{ getTotalVulns() }}</strong> Findings</span>
      </div>
    </div>

    <!-- Grid changed to max 3 columns for "bigger" cards -->
    <div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
      <article *ngFor="let program of programs"
               class="group relative flex flex-col rounded-[24px] border border-white/5 bg-surface/20 p-6 shadow-2xl backdrop-blur-sm transition-all duration-500 hover:-translate-y-2 hover:border-primary/30 hover:bg-surface/40">

        <!-- Program Image Container -->
        <div class="relative mb-6 flex h-48 items-center justify-center overflow-hidden rounded-[18px] border border-white/5 bg-background/60 p-8">
          <!-- Subtle Grid Overlay -->
          <div class="absolute inset-0 opacity-[0.03] [background-image:linear-gradient(to_right,#888_1px,transparent_1px),linear-gradient(to_bottom,#888_1px,transparent_1px)] [background-size:20px_20px]"></div>

        <img
          [src]="program.image"
          [alt]="program.name"
          class="absolute inset-0 h-full w-full object-cover opacity-90 transition duration-500 group-hover:opacity-100 group-hover:scale-105"
        />
        </div>

        <!-- Content -->
        <div class="flex flex-1 flex-col">
          <div class="mb-3 flex items-center justify-between">
            <h3 class="text-2xl font-bold tracking-tight text-text-primary">{{ program.name }}</h3>
            <span *ngIf="program.featured"
                  class="flex items-center gap-1.5 rounded-full border border-primary/20 bg-primary/5 px-3 py-1 text-[10px] font-black uppercase tracking-wider text-primary">
              <span class="h-1 w-1 rounded-full bg-primary animate-pulse"></span>
              Featured
            </span>
          </div>

          <p class="mb-8 line-clamp-3 text-base leading-7 text-text-secondary group-hover:text-text-primary transition-colors">
            {{ program.description }}
          </p>

          <!-- Action Button -->
          <div class="mt-auto pt-6 border-t border-white/5">
            <button class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-white/[0.03] border border-white/10 px-5 py-3 text-sm font-bold uppercase tracking-widest text-text-primary transition-all duration-300 hover:bg-primary hover:text-background hover:border-primary hover:shadow-[0_0_20px_rgba(0,255,153,0.3)]">
              <span>View Report</span>
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
              </svg>
            </button>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
