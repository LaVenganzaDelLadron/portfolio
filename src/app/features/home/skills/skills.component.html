<section class="section-padding border-b border-white/5" id="skills">
  <div class="container">
    <app-section-title number="03" title="Core Skills"></app-section-title>

    <div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-4" [@staggerFadeIn]="skillCategories.length">
      @for (category of skillCategories; track category.title) {
        <div class="group flex min-h-full flex-col rounded-[20px] border border-white/5 bg-surface/40 p-6 shadow-[0_24px_70px_-52px_rgba(0,0,0,0.9)] backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:scale-[1.01] hover:border-primary/30 hover:bg-surface/55">
          <div class="mb-7 flex items-center gap-4">
            <div class="flex h-12 w-12 items-center justify-center rounded-[20px] border border-white/10 bg-white/[0.03] text-lg text-primary transition-all duration-300 group-hover:border-primary/30 group-hover:bg-primary/5">
              <i [class]="category.icon"></i>
            </div>
            <h3 class="text-lg font-bold tracking-tight text-text-primary">{{ category.title }}</h3>
          </div>

          <div class="flex flex-wrap gap-2">
            @if (isStringArray(category.skills)) {
              @for (skill of category.skills; track skill) {
                <span class="rounded-full border border-white/10 bg-background/40 px-3 py-1.5 text-sm font-medium text-text-secondary transition-colors duration-300 hover:border-primary/30 hover:text-primary">
                  {{ skill }}
                </span>
              }
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
