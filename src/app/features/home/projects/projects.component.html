<section class="section-padding border-b border-white/5" id="projects">
  <div class="container">

    <!-- Header -->
    <div class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
      <app-section-title number="02" title="Selected Projects"></app-section-title>
    </div>

    <!-- Projects Grid -->
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

      <article
        class="group flex flex-col overflow-hidden rounded-[20px] border border-white/5 bg-surface/40 shadow-lg backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-primary/30 hover:shadow-[0_20px_60px_-40px_rgba(0,255,153,0.25)]"
        *ngFor="let project of featuredProjects"
      >

        <!-- Image -->
        <a [href]="project.liveUrl" target="_blank" rel="noopener" class="block overflow-hidden">
          <img
            [src]="project.image"
            [alt]="project.title"
            class="aspect-[16/9] w-full object-cover opacity-90 transition duration-500 group-hover:scale-[1.02] group-hover:opacity-100"
          />
        </a>

        <!-- Content -->
        <div class="flex flex-col p-5">

          <!-- Title + Category -->
          <div class="mb-3 flex items-start justify-between gap-4">
            <h3 class="text-xl font-bold tracking-tight text-text-primary">
              {{ project.title }}
            </h3>

            <span
              class="rounded-full border border-white/10 bg-white/[0.03] px-3 py-1 text-[10px] font-bold uppercase tracking-widest text-text-secondary"
            >
              {{ project.category }}
            </span>
          </div>

          <!-- Description -->
          <p class="mb-4 line-clamp-2 text-sm leading-6 text-text-secondary">
            {{ project.description }}
          </p>

          <!-- Tech Stack -->
          <div class="mb-5 flex flex-wrap gap-2">
            <span
              *ngFor="let tech of project.technologies.slice(0, 5)"
              class="rounded-full border border-white/10 bg-background/40 px-2.5 py-1 text-[10px] text-text-secondary"
            >
              {{ tech }}
            </span>
          </div>

          <!-- Buttons -->
          <div class="mt-auto grid grid-cols-2 gap-3">

            <!-- GitHub -->
            <a
              [href]="project.githubUrl"
              target="_blank"
              rel="noopener"
              class="inline-flex items-center justify-center gap-2 rounded-[20px] border border-white/10 bg-white/[0.03] px-4 py-3 text-sm font-semibold text-text-primary transition duration-300 hover:border-primary/40 hover:bg-primary/5 hover:text-primary"
            >
              <i class="fab fa-github"></i>
              GitHub
            </a>
          </div>

        </div>
      </article>

    </div>
  </div>
</section>
